<script>
document.addEventListener("DOMContentLoaded", () => {
  // [テキスト](URL) に一致する正規表現（画像 ![alt](url) は除外）
  const mdLinkRegex = /(?<!!)\[([^\]]+)\]\(([^)\s]+)(?:\s+"([^"]*)")?\)/g;

  // 相対パスの .md 拡張子を .html に変換するヘルパー関数
  const convertMdUrlToHtml = (rawUrl) => {
    // http://, https://, mailto:, tel: などの外部・特殊スキームはそのまま返す
    if (/^[a-zA-Z][a-zA-Z0-9+.-]*:/.test(rawUrl)) {
      return rawUrl;
    }
    // パス部分の末尾が .md の場合のみ .html に置換（#アンカーや ?クエリは保持）
    return rawUrl.replace(/\.md(?=$|[?#])/i, ".html");
  };

  // ページ内のすべての table 要素を対象にする
  document.querySelectorAll("table").forEach((table) => {
    // HTMLタグを壊さず「テキストノード」だけを走査する
    const walker = document.createTreeWalker(
      table,
      NodeFilter.SHOW_TEXT,
      {
        acceptNode: (node) => {
          // すでに <a> や <code>, <pre> の中にあるテキストは除外
          if (node.parentElement.closest("a, code, pre")) {
            return NodeFilter.FILTER_REJECT;
          }
          return mdLinkRegex.test(node.nodeValue)
            ? NodeFilter.FILTER_ACCEPT
            : NodeFilter.FILTER_SKIP;
        }
      }
    );

    const targetNodes = [];
    let currentNode;
    while ((currentNode = walker.nextNode())) {
      targetNodes.push(currentNode);
    }

    // 該当するテキストノードを <a> 要素を含むノード群に置き換え
    targetNodes.forEach((textNode) => {
      const text = textNode.nodeValue;
      const fragment = document.createDocumentFragment();
      let lastIndex = 0;
      mdLinkRegex.lastIndex = 0;

      let match;
      while ((match = mdLinkRegex.exec(text)) !== null) {
        // マッチ前の通常テキストを追加
        if (match.index > lastIndex) {
          fragment.appendChild(
            document.createTextNode(text.slice(lastIndex, match.index))
          );
        }

        // <a> タグを生成（URLの .md を .html に変換）
        const [, linkText, url, title] = match;
        const a = document.createElement("a");
        a.href = convertMdUrlToHtml(url);
        a.textContent = linkText;
        if (title) a.title = title;

        fragment.appendChild(a);
        lastIndex = mdLinkRegex.lastIndex;
      }

      // 残りの通常テキストを追加
      if (lastIndex < text.length) {
        fragment.appendChild(document.createTextNode(text.slice(lastIndex)));
      }

      textNode.parentNode.replaceChild(fragment, textNode);
    });
  });
});
</script>
